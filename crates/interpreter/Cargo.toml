[package]
name = "interpreter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "smol"
path = "src/main.rs"

[features]
# Debug-only instrumentation: records max `step_loop` recursion depth and prints
# `size_of::<Cont>()`. Used by C31.5 to measure per-level stack cost before/after
# the frame-shrinking work. Off by default; never affects release behavior.
step_probe = []

[dependencies]
thiserror = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
parking_lot = { workspace = true }
may = { workspace = true }
triple-store = { path = "../triple-store" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "interpreter"
harness = false

[lints]
workspace = true
